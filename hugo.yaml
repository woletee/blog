baseURL: "https://woletee.github.io/"
locale: "en-us"
title: "Marya's Blog"
theme: ["PaperMod4"]

enableRobotsTXT: true
enableEmoji: true

outputs:
  home: ["HTML", "RSS", "JSON"]

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"], ["$", "$"]]
  highlight:
    noClasses: false
    lineNos: false
    style: github-dark
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  author: "Marya"
  description: "Notes on AI research, including diffusion models, transformers, and model evaluation."
  keywords: ["AI research", "machine learning", "diffusion models", "transformers", "model evaluation"]
  defaultTheme: auto
  mainSections: ["diffusion", "posts"]
  ShowReadingTime: true
  ShowToc: true
  TocOpen: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowShareButtons: true
  comments: true
  # Formspree (or similar) form URL that receives the anonymous notes, e.g. https://formspree.io/f/abcd1234
  feedbackEndpoint: ""
  displayFullLangName: true

  homeInfoParams:
    Title: "Marya's Blog"
    Content: >
      Small AI experiments, explained simply, with code you can run.

  socialIcons:
    - name: github
      title: "GitHub"
      url: "https://github.com/woletee"
    - name: rss
      title: "RSS"
      url: "index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    threshold: 0.3
    minMatchCharLength: 2
    keys: ["title", "summary", "content", "tags", "categories"]

menu:
  main:
    - name: Topics
      url: /categories/
      weight: 10
    - name: All Posts
      url: /posts/
      weight: 20
    - name: Tags
      url: /tags/
      weight: 30
    - name: About
      url: /about/
      weight: 40
    - name: Search
      url: /search/
      weight: 50
